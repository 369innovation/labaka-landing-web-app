<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening Profile...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 {
            color: #333;
            margin-bottom: 15px;
            font-size: 24px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        button {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .primary-btn {
            background: #667eea;
            color: white;
        }
        .primary-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        .secondary-btn {
            background: #f3f4f6;
            color: #374151;
        }
        .secondary-btn:hover {
            background: #e5e7eb;
        }
        .error {
            color: #dc2626;
            background: #fee2e2;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }
        .profile-card {
            text-align: left;
            margin-top: 20px;
            padding: 20px;
            background: #f9fafb;
            border-radius: 10px;
        }
        .profile-item {
            margin: 10px 0;
            padding: 8px 0;
            border-bottom: 1px solid #e5e7eb;
        }
        .profile-item:last-child {
            border-bottom: none;
        }
        .profile-label {
            font-weight: 600;
            color: #374151;
            display: inline-block;
            min-width: 100px;
        }
        .profile-value {
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader" id="loader"></div>
        <h1 id="title">Opening Profile...</h1>
        <p id="message">Please wait while we redirect you to the app.</p>
        <div class="button-group" id="buttons" style="display: none;">
            <button class="primary-btn" onclick="openApp()">Open in App</button>
            <button class="secondary-btn" onclick="viewInBrowser()">View in Browser</button>
        </div>
        <div id="profileCard" class="profile-card" style="display: none;"></div>
        <div id="error" class="error" style="display: none;"></div>
    </div>

    <script>
        const pathParts = window.location.pathname.split('/').filter(Boolean);
        const mode = pathParts[1];
        const qrId = pathParts[2];
        
        const appScheme = 'tabullet';
        const deepLink = `${appScheme}://profile/${mode}/${qrId}`;
        
        function openApp() {
            window.location.href = deepLink;
            
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('title').textContent = 'App Not Installed?';
                document.getElementById('message').textContent = 'Install the Tabullet app to view this profile, or continue in your browser.';
                document.getElementById('buttons').style.display = 'flex';
            }, 2000);
        }

        async function viewInBrowser() {
            try {
                document.getElementById('loader').style.display = 'block';
                document.getElementById('buttons').style.display = 'none';
                document.getElementById('profileCard').style.display = 'none';
                document.getElementById('error').style.display = 'none';
                document.getElementById('title').textContent = 'Loading Profile...';
                document.getElementById('message').textContent = 'Fetching profile data...';
                
                const response = await fetch(`https://tabullet.com/api/qr/profile/${qrId}`);
                const data = await response.json();
                
                if (data.success) {
                    displayProfile(data.data);
                } else {
                    showError('Profile not found or QR code is inactive.');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Failed to load profile. Please try again.');
            }
        }

        function displayProfile(profile) {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('title').textContent = profile.name || 'User Profile';
            document.getElementById('message').textContent = 'Profile loaded successfully!';
            
            const profileCard = document.getElementById('profileCard');
            profileCard.innerHTML = `
                <div class="profile-item">
                    <span class="profile-label">Name:</span>
                    <span class="profile-value">${profile.name || 'N/A'}</span>
                </div>
                <div class="profile-item">
                    <span class="profile-label">Profile Mode:</span>
                    <span class="profile-value">${profile.profileMode || 'N/A'}</span>
                </div>
                <div class="profile-item">
                    <span class="profile-label">Age:</span>
                    <span class="profile-value">${profile.age || 'N/A'}</span>
                </div>
                <div class="profile-item">
                    <span class="profile-label">Gender:</span>
                    <span class="profile-value">${profile.gender || 'N/A'}</span>
                </div>
                <div class="profile-item">
                    <span class="profile-label">Location:</span>
                    <span class="profile-value">${profile.location.name || 'N/A'}</span>
                </div>
            `;
            profileCard.style.display = 'block';
            document.getElementById('buttons').style.display = 'flex';
        }

        function showError(message) {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('error').textContent = message;
            document.getElementById('error').style.display = 'block';
            document.getElementById('buttons').style.display = 'flex';
        }

        window.onload = openApp;
    </script>
</body>
</html>
